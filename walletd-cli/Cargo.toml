[package]
name = "walletd-cli"
version = "0.2.1"
edition = "2021"
description = "Multi-chain cryptocurrency wallet CLI - 17+ blockchain support"
authors = ["Aslan Puff Paw <aslan@walletd.org>"]
license = "MIT"
readme = "README.md"
repository = "https://github.com/AslanPonies/walletd-v1.1"
keywords = ["cryptocurrency", "wallet", "blockchain", "bitcoin", "ethereum"]
categories = ["cryptography::cryptocurrencies", "command-line-utilities"]

[[bin]]
name = "walletd"
path = "src/main.rs"

[[bin]]
name = "walletd-icp-cli"
path = "src/main.rs"

[dependencies]
# Core dependencies
tokio = { version = "1.0", features = ["full", "rt-multi-thread", "macros"] }
anyhow = "1.0"
thiserror = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"

# Crypto primitives
hex = "0.4"
bip39 = "2.0"
k256 = { version = "0.13", features = ["ecdsa"] }
ed25519-dalek = { version = "2.0", features = ["rand_core"] }
sha2 = "0.10"
sha3 = "0.10"
ripemd = "0.1"
blake2 = "0.10"
bs58 = "0.5"

# HTTP client
reqwest = { version = "0.11", features = ["json"] }

# CLI UI
colored = "2.0"
dialoguer = "0.11"

# Async utilities
async-trait = "0.1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Configuration
dirs = "5.0"
chrono = "0.4"

[dev-dependencies]
tokio-test = "0.4"

[features]
default = []

[package.metadata.docs.rs]
all-features = true
