[package]
name = "walletd-staking"
version = "1.4.0"
edition = "2021"
description = "Staking support for WalletD SDK (ETH, SOL, DOT, ATOM, ADA)"
license = "MIT OR Apache-2.0"

[dependencies]
tokio = { version = "1.35", features = ["full"] }
async-trait = "0.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
thiserror = "1.0"
reqwest = { version = "0.11", features = ["json", "rustls-tls"], default-features = false }
hex = "0.4"
