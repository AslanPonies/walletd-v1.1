# WalletD CI/CD Pipeline
#
# This workflow runs on every push and pull request to ensure code quality.
# 
# Jobs:
# 1. Check - Fast compilation check
# 2. Test - Run all unit tests
# 3. Clippy - Lint for common mistakes
# 4. Format - Check code formatting
# 5. Security - Audit dependencies for vulnerabilities
# 6. Coverage - Generate test coverage report
# 7. Integration - Run integration tests against testnets (manual trigger)
# 8. Release - Build and publish releases (on tags)

name: CI/CD

on:
  push:
    branches: [main, develop]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      run_integration_tests:
        description: 'Run integration tests against testnets'
        required: false
        default: 'false'
        type: boolean

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ==========================================================================
  # Fast Check - Ensure code compiles
  # ==========================================================================
  check:
    name: Check
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-action@stable
        with:
          components: rustfmt, clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-rust"

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config

      - name: Check compilation
        run: cargo check --workspace --all-targets

  # ==========================================================================
  # Unit Tests
  # ==========================================================================
  test:
    name: Test
    runs-on: ${{ matrix.os }}
    needs: check
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        rust: [stable, beta]
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust ${{ matrix.rust }}
        uses: dtolnay/rust-action@master
        with:
          toolchain: ${{ matrix.rust }}

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2
        with:
          prefix-key: "v1-rust-${{ matrix.os }}"

      - name: Install dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config

      - name: Install dependencies (macOS)
        if: matrix.os == 'macos-latest'
        run: brew install openssl

      - name: Run tests
        run: cargo test --workspace --verbose

      - name: Run tests (release mode)
        run: cargo test --workspace --release

  # ==========================================================================
  # Clippy Linting
  # ==========================================================================
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    needs: check
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-action@stable
        with:
          components: clippy

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config

      - name: Run Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  # ==========================================================================
  # Code Formatting
  # ==========================================================================
  format:
    name: Format
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-action@nightly
        with:
          components: rustfmt

      - name: Check formatting
        run: cargo fmt --all -- --check

  # ==========================================================================
  # Security Audit
  # ==========================================================================
  security:
    name: Security Audit
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install cargo-audit
        run: cargo install cargo-audit

      - name: Run security audit
        run: cargo audit

  # ==========================================================================
  # Test Coverage
  # ==========================================================================
  coverage:
    name: Coverage
    runs-on: ubuntu-latest
    needs: test
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-action@stable
        with:
          components: llvm-tools-preview

      - name: Install cargo-llvm-cov
        uses: taiki-e/install-action@cargo-llvm-cov

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config

      - name: Generate coverage report
        run: cargo llvm-cov --workspace --lcov --output-path lcov.info

      - name: Upload to Codecov
        uses: codecov/codecov-action@v3
        with:
          files: lcov.info
          fail_ci_if_error: false

  # ==========================================================================
  # Integration Tests (Manual or on main)
  # ==========================================================================
  integration:
    name: Integration Tests
    runs-on: ubuntu-latest
    needs: [test, clippy]
    if: |
      github.event_name == 'workflow_dispatch' && 
      github.event.inputs.run_integration_tests == 'true' ||
      github.ref == 'refs/heads/main'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-action@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config

      - name: Run integration tests
        run: cargo test --workspace -- --ignored
        env:
          # Add testnet API keys if needed
          BTC_TESTNET_RPC: https://blockstream.info/testnet/api
          ETH_SEPOLIA_RPC: https://rpc.sepolia.org
          SOL_DEVNET_RPC: https://api.devnet.solana.com
        continue-on-error: true  # Don't fail CI on network issues

  # ==========================================================================
  # Documentation
  # ==========================================================================
  docs:
    name: Documentation
    runs-on: ubuntu-latest
    needs: check
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-action@stable

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config

      - name: Build documentation
        run: cargo doc --workspace --no-deps
        env:
          RUSTDOCFLAGS: "-D warnings"

      - name: Upload docs artifact
        uses: actions/upload-artifact@v3
        with:
          name: documentation
          path: target/doc

  # ==========================================================================
  # Release Build
  # ==========================================================================
  release:
    name: Release
    runs-on: ${{ matrix.os }}
    needs: [test, clippy, security]
    if: startsWith(github.ref, 'refs/tags/v')
    strategy:
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            artifact: walletd-linux-x64
          - os: macos-latest
            target: x86_64-apple-darwin
            artifact: walletd-macos-x64
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: walletd-macos-arm64
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-action@stable
        with:
          targets: ${{ matrix.target }}

      - name: Install dependencies (Ubuntu)
        if: matrix.os == 'ubuntu-latest'
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config

      - name: Build release
        run: cargo build --release --target ${{ matrix.target }}

      - name: Package (Unix)
        run: |
          mkdir -p dist
          cp target/${{ matrix.target }}/release/walletd-cli dist/ || true
          cp target/${{ matrix.target }}/release/libwalletd_ffi.* dist/ || true
          cp README.md LICENSE* dist/
          tar -czvf ${{ matrix.artifact }}.tar.gz -C dist .

      - name: Upload release artifact
        uses: actions/upload-artifact@v3
        with:
          name: ${{ matrix.artifact }}
          path: ${{ matrix.artifact }}.tar.gz

  # ==========================================================================
  # Publish to crates.io (manual trigger only)
  # ==========================================================================
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    environment: crates-io  # Requires manual approval
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-action@stable

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev pkg-config

      - name: Publish walletd-broadcast
        run: cargo publish -p walletd-broadcast --token ${{ secrets.CRATES_IO_TOKEN }}
        continue-on-error: true

      - name: Publish walletd-hardware
        run: cargo publish -p walletd-hardware --token ${{ secrets.CRATES_IO_TOKEN }}
        continue-on-error: true

      - name: Publish walletd-staking
        run: cargo publish -p walletd-staking --token ${{ secrets.CRATES_IO_TOKEN }}
        continue-on-error: true

      - name: Publish walletd-multisig
        run: cargo publish -p walletd-multisig --token ${{ secrets.CRATES_IO_TOKEN }}
        continue-on-error: true

      - name: Publish walletd
        run: cargo publish -p walletd --token ${{ secrets.CRATES_IO_TOKEN }}
        continue-on-error: true

  # ==========================================================================
  # Create GitHub Release
  # ==========================================================================
  github-release:
    name: GitHub Release
    runs-on: ubuntu-latest
    needs: release
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - name: Download artifacts
        uses: actions/download-artifact@v3
        with:
          path: artifacts

      - name: Create Release
        uses: softprops/action-gh-release@v1
        with:
          files: |
            artifacts/**/*.tar.gz
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(github.ref, '-rc') || contains(github.ref, '-beta') }}
