[workspace]
resolver = "2"
members = [
    "walletd-broadcast",
    "walletd-hardware",
    "walletd-multisig", 
    "walletd-staking",
    "walletd-ffi",
]

[workspace.package]
version = "1.4.0"
edition = "2021"
authors = ["WalletD Team"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/walletd/walletd"

[profile.release]
lto = true
codegen-units = 1
opt-level = 3

